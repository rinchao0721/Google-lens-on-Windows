[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/platform",
    "crates/overlay",
    "crates/upload",
    "crates/actions",
    "crates/settings_ui",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# 设置窗口专用；关闭默认特性，只开 glow 后端、内置字体与无障碍支持
eframe = { version = "0.32.3", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
# 构建期嵌入图标、manifest 和版本信息，只被 app 的 build.rs 使用
embed-resource = "3.0.12"
# 内部 crate
lenswin-core = { path = "crates/core" }
lenswin-platform = { path = "crates/platform" }
lenswin-overlay = { path = "crates/overlay" }
lenswin-upload = { path = "crates/upload" }
lenswin-actions = { path = "crates/actions" }
lenswin-settings-ui = { path = "crates/settings_ui" }

# 外部依赖（均在 PLAN 第 8 节批准范围内）
anyhow = "1.0.104"
log = "0.4.35"
png = "0.18.1"
# 0.13 起特性改名且默认依赖 aws-lc，固定 0.12 以使用 PLAN 约定的 rustls-tls
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
simplelog = { version = "0.12.2", default-features = false, features = ["local-offset"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
thiserror = "2.0.21"
toml = "1.2.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
